name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-android:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cache OpenCV Android SDK
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/opencv
          key: opencv-android-sdk-4.10.0

      - name: Download and Unpack OpenCV Android SDK
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/opencv"
          curl -L -o opencv.zip "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip"
          unzip -q opencv.zip -d "${{ runner.temp }}/opencv"
          rm opencv.zip

      - name: Run Android Unit Tests
        env:
          OPENCV_ANDROID_SDK_DIR: ${{ runner.temp }}/opencv/OpenCV-android-sdk
        run: |
          ./gradlew test --stacktrace

  test-vscode-extension:
    name: VS Code Extension Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        working-directory: vscode-extension
        run: |
          npm ci

      - name: Generate Protobuf Code
        working-directory: vscode-extension
        run: |
          npm run generate

      - name: Run VS Code Extension Tests
        working-directory: vscode-extension
        run: |
          npm test
