name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cache OpenCV Android SDK
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/opencv
          key: opencv-android-sdk-4.10.0

      - name: Download and Unpack OpenCV Android SDK
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/opencv"
          curl -L -o opencv.zip "https://github.com/opencv/opencv/releases/download/4.10.0/opencv-4.10.0-android-sdk.zip"
          unzip -q opencv.zip -d "${{ runner.temp }}/opencv"
          rm opencv.zip

      - name: Prepare Signing Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > "${{ runner.temp }}/release.keystore"
            echo "KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> $GITHUB_ENV
          else
            echo "::warning::No SIGNING_KEY secret found. APKs will be built unsigned."
          fi

      - name: Build Release APKs
        env:
          OPENCV_ANDROID_SDK_DIR: ${{ runner.temp }}/opencv/OpenCV-android-sdk
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Collect & Rename APKs
        run: |
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          APK_DIR="app/build/outputs/apk/release"

          for apk in "$APK_DIR"/*.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk")
              # app-arm64-v8a-release.apk -> ReLC-v0.1.0-arm64-v8a.apk
              # app-universal-release.apk -> ReLC-v0.1.0-universal.apk
              # app-release-unsigned.apk -> ReLC-v0.1.0-unsigned.apk
              clean_name=$(echo "$filename" | sed -E 's/^app-//; s/-release\.apk$/.apk/; s/\.apk$//')
              dest="dist/ReLC-${TAG}-${clean_name}.apk"
              cp "$apk" "$dest"
              echo "Collected: $dest"
            fi
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: relc-apks
          path: dist/*.apk
          retention-days: 7

  build-vscode-extension:
    name: Build VS Code Extension (.vsix)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies and compile
        working-directory: vscode-extension
        run: |
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npm ci
          npm test

      - name: Package VSIX
        working-directory: vscode-extension
        run: |
          mkdir -p ../dist
          npx @vscode/vsce package --no-dependencies -o "../dist/relc-script-workbench-${{ steps.version.outputs.version }}.vsix"

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: relc-vscode-extension
          path: dist/*.vsix
          retention-days: 7

  create-draft-release:
    name: Create Draft Release
    needs: [build-apk, build-vscode-extension]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: relc-apks
          path: release-assets

      - name: Download VSIX Artifact
        uses: actions/download-artifact@v4
        with:
          name: relc-vscode-extension
          path: release-assets

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ReLC ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
