name: Lua stub sync

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the checker's own tests
        run: node --test .github/scripts/check-lua-stub-sync.test.mjs

      - name: Check Lua API names match the stub
        run: node .github/scripts/check-lua-stub-sync.mjs
