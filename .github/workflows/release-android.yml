name: Release Android

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix, e.g. 0.6.0. The tag is created on the dispatched commit.'
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.ref }}" != "refs/heads/master" ]; then
              echo "::error::Manual releases must be dispatched from master"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
            if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
              echo "::error::Tag v${VERSION} already exists"
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '${VERSION}' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Read OpenCV Version
        id: opencv
        run: |
          VERSION=$(sed -n 's/^opencv = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$VERSION" || { echo "::error::opencv version not found in gradle/libs.versions.toml"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Cache OpenCV Android SDK
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/opencv
          key: opencv-android-sdk-${{ steps.opencv.outputs.version }}

      - name: Download and Unpack OpenCV Android SDK
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/opencv"
          curl -L -o opencv.zip "https://github.com/opencv/opencv/releases/download/${{ steps.opencv.outputs.version }}/opencv-${{ steps.opencv.outputs.version }}-android-sdk.zip"
          unzip -q opencv.zip -d "${{ runner.temp }}/opencv"
          rm opencv.zip

      - name: Prepare Signing Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            node -e '
              const fs = require("fs");
              const raw = process.env.SIGNING_KEY || "";
              const clean = raw.replace(/\s+/g, "");
              fs.writeFileSync("${{ runner.temp }}/release.keystore", Buffer.from(clean, "base64"));
            '
            echo "KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> $GITHUB_ENV
          else
            echo "::warning::No SIGNING_KEY secret found. APKs will be built unsigned."
          fi

      - name: Build Release APKs
        env:
          OPENCV_ANDROID_SDK_DIR: ${{ runner.temp }}/opencv/OpenCV-android-sdk
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PversionName="${{ steps.version.outputs.version }}" --stacktrace

      - name: Collect & Rename APKs
        run: |
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          APK_DIR="app/build/outputs/apk/release"

          for apk in "$APK_DIR"/*.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk")
              # app-arm64-v8a-release.apk -> MoonClicker-v0.1.0-arm64-v8a.apk
              # app-universal-release.apk -> MoonClicker-v0.1.0-universal.apk
              # app-release-unsigned.apk -> MoonClicker-v0.1.0-unsigned.apk
              clean_name=$(echo "$filename" | sed -E 's/^app-//; s/-release\.apk$/.apk/; s/\.apk$//')
              dest="dist/MoonClicker-${TAG}-${clean_name}.apk"
              cp "$apk" "$dest"
              echo "Collected: $dest"
            fi
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonclicker-apks
          path: dist/*.apk
          retention-days: 7

  create-draft-release:
    name: Create Draft Release
    needs: [build-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 以 GITHUB_TOKEN 推送的 tag 不會再觸發本 workflow，不會重複 build
      - name: Create Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ needs.build-apk.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ needs.build-apk.outputs.tag }}"

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: moonclicker-apks
          path: release-assets

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-apk.outputs.tag }}
          name: MoonClicker ${{ needs.build-apk.outputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
