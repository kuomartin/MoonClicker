name: Release Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name'
        required: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cache OpenCV Android SDK
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/opencv
          key: opencv-android-sdk-5.0.0

      - name: Download and Unpack OpenCV Android SDK
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/opencv"
          curl -L -o opencv.zip "https://github.com/opencv/opencv/releases/download/5.0.0/opencv-5.0.0-android-sdk.zip"
          unzip -q opencv.zip -d "${{ runner.temp }}/opencv"
          rm opencv.zip

      - name: Prepare Signing Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            node -e '
              const fs = require("fs");
              const raw = process.env.SIGNING_KEY || "";
              const clean = raw.replace(/\s+/g, "");
              fs.writeFileSync("${{ runner.temp }}/release.keystore", Buffer.from(clean, "base64"));
            '
            echo "KEYSTORE_PATH=${{ runner.temp }}/release.keystore" >> $GITHUB_ENV
          else
            echo "::warning::No SIGNING_KEY secret found. APKs will be built unsigned."
          fi

      - name: Build Release APKs
        env:
          OPENCV_ANDROID_SDK_DIR: ${{ runner.temp }}/opencv/OpenCV-android-sdk
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Collect & Rename APKs
        run: |
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          APK_DIR="app/build/outputs/apk/release"

          for apk in "$APK_DIR"/*.apk; do
            if [ -f "$apk" ]; then
              filename=$(basename "$apk")
              # app-arm64-v8a-release.apk -> MoonClicker-v0.1.0-arm64-v8a.apk
              # app-universal-release.apk -> MoonClicker-v0.1.0-universal.apk
              # app-release-unsigned.apk -> MoonClicker-v0.1.0-unsigned.apk
              clean_name=$(echo "$filename" | sed -E 's/^app-//; s/-release\.apk$/.apk/; s/\.apk$//')
              dest="dist/MoonClicker-${TAG}-${clean_name}.apk"
              cp "$apk" "$dest"
              echo "Collected: $dest"
            fi
          done

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moonclicker-apks
          path: dist/*.apk
          retention-days: 7

  create-draft-release:
    name: Create Draft Release
    needs: [build-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: moonclicker-apks
          path: release-assets

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MoonClicker ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: true
          generate_release_notes: true
          files: release-assets/*
