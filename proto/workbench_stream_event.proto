syntax = "proto3";

package moonclicker.workbench;

import "google/protobuf/struct.proto";

// Script Workbench 的 WebSocket 串流事件唯一 schema。app 端 WorkbenchServer.kt
// （Wire）與 vscode-extension 端 workbenchConnection.ts（@bufbuild/protobuf）
// 都從這一份 .proto 產生型別。

message StreamEvent {
  oneof event {
    string log = 1;
    // ScriptEngine.sharedData 的值只會是 Double/String/Boolean（table 在引擎端
    // 已經 JSON 字串化）；Struct 是剛好對應這種動態小型 map 的標準型別。
    google.protobuf.Struct data = 2;
    FileChangeEvent file_change = 3;
    RunStateEvent run_state = 4;
  }
}

// 裝置上執行中的腳本變動時推播。連線當下若有腳本在跑會先送一筆；沒有就不送，
// client 連上時一律假設沒有腳本在跑。
message RunStateEvent {
  // 執行中腳本的資料夾名稱（Script Folder 的 id）；空字串代表沒有腳本在跑。
  string script_id = 1;
}

// Script Folder 底下的檔案被寫入/刪除時推播（VS Code FileSystemProvider 的
// onDidChangeFile 用），不管改動是透過 workbench 的單檔案 HTTP API 還是被外部
// （檔案管理員、USB 接電腦）直接動到。
message FileChangeEvent {
  enum Kind {
    CREATED = 0;
    CHANGED = 1;
    DELETED = 2;
  }
  string script_id = 1;
  // 相對於該 script 資料夾根目錄的路徑，用 `/` 分隔。
  string path = 2;
  Kind kind = 3;
}
