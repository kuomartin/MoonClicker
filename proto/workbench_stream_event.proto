syntax = "proto3";

package moonclicker.workbench;

import "google/protobuf/struct.proto";

// Script Workbench 的 WebSocket 串流事件唯一 schema。app 端 WorkbenchServer.kt
// （Wire）與 vscode-extension 端 workbenchConnection.ts（@bufbuild/protobuf）
// 都從這一份 .proto 產生型別。

// Workbench 協定版本。改動 HTTP 路由或串流事件而舊的另一端無法正確運作時加一。
// App 在 `GET /device` 回報自己的版本；擴充套件連串流時以 `?protocol=` 帶上自己的版本，
// 不一致時 App 以 1008 關閉串流，擴充套件提示更新較舊的一方。
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 3;
}

message StreamEvent {
  // 1、2、4 是協定版本 1 的 log、data、run_state。
  reserved 1, 2, 4;
  oneof event {
    FileChangeEvent file_change = 3;
    LogEvent log = 5;
    DataEvent data = 6;
    RunStateEvent run_state = 7;
    ReplEvent repl = 8;
  }
}

// 腳本以 `log(...)` 送出的一行。
message LogEvent {
  string script_id = 1;
  string line = 2;
}

// 腳本 `data` 的變動。每條連線上，每支腳本的第一筆是 reset 的完整快照，之後只送差異。
// 值只會是 number/string/boolean（table 在引擎端已經 JSON 字串化）。
message DataEvent {
  string script_id = 1;
  // true 表示先清空這支腳本的 data，再套用 values。
  bool reset = 2;
  google.protobuf.Struct values = 3;
  repeated string removed = 4;
}

// 執行中的腳本變動時推播；連線當下一律先送一筆。
message RunStateEvent {
  // 執行中腳本的資料夾名稱（Script Folder 的 id）。
  repeated string running_script_ids = 1;
}

// Script Folder 底下的檔案被寫入/刪除時推播（VS Code FileSystemProvider 的
// onDidChangeFile 用），不管改動是透過 workbench 的單檔案 HTTP API 還是被外部
// （檔案管理員、USB 接電腦）直接動到。
message FileChangeEvent {
  enum Kind {
    CREATED = 0;
    CHANGED = 1;
    DELETED = 2;
  }
  string script_id = 1;
  // 相對於該 script 資料夾根目錄的路徑，用 `/` 分隔。
  string path = 2;
  Kind kind = 3;
}

// REPL 的活動。所有連線看到的是同一個 REPL（VS Code 與 MCP 共用），所以每一段的程式碼與結果
// 都推播出去，不只回給送出的那一端。
message ReplEvent {
  oneof event {
    ReplStateEvent state = 1;
    // REPL 以 `log(...)` 送出的一行。
    string log = 2;
    ReplChunkEvent chunk = 3;
    // REPL 的 `data` 變動；script_id 一律是空字串，規則同腳本的 DataEvent。
    DataEvent data = 4;
  }
}

// REPL 開關、目標或忙碌狀態變動時推播；連線當下一律先送一筆。
message ReplStateEvent {
  bool open = 1;
  int32 display_id = 2;
  // `require` 與模板路徑的根；空字串表示整個 scripts 資料夾。
  string script_id = 3;
  // 有程式碼正在跑或排隊。
  bool busy = 4;
}

// 一段程式碼跑完。
message ReplChunkEvent {
  enum Status {
    OK = 0;
    ERROR = 1;
    INCOMPLETE = 2;
    INTERRUPTED = 3;
    CLOSED = 4;
  }
  // 送出這段的那一端自己產生的識別，讓它分得出哪些是自己送的。
  string client = 1;
  string code = 2;
  Status status = 3;
  // OK 時是回傳值（以 tab 串起，沒有回傳值時為空字串），其餘是錯誤訊息。
  string output = 4;
}
