<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.5" />
    </linearGradient>

    <!-- Ambient Glow Top-Right -->
    <radialGradient id="ambientCyan" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Glow Bottom-Left -->
    <radialGradient id="ambientPurple" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Virtual Display Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.88" />
    </linearGradient>

    <!-- Glass Window Border Gradient -->
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Lua Primary Sphere Gradient -->
    <linearGradient id="luaMoonGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="25%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Lua Crescent Glow Gradient -->
    <linearGradient id="crescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#93C5FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.15" />
    </linearGradient>

    <!-- Lua Satellite Sphere Gradient -->
    <radialGradient id="satelliteGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#67E8F9" />
      <stop offset="75%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </radialGradient>

    <!-- Signal Arc Gradient -->
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Glow & Shadow -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Base Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="url(#ambientCyan)" />
  <rect width="512" height="512" rx="115" fill="url(#ambientPurple)" />
  <rect width="512" height="512" rx="115" fill="url(#techGrid)" />

  <!-- Outer Icon Border Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Background Layer: Second Virtual Display Pane (Depth Layer) -->
  <rect x="110" y="70" width="310" height="310" rx="28" fill="#1E293B" fill-opacity="0.3" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1.5" transform="rotate(6 265 225)" />

  <!-- Main Virtual Display Window (Glassmorphic Container) -->
  <g filter="url(#shadowFilter)">
    <rect x="76" y="80" width="360" height="352" rx="30" fill="url(#glassGrad)" stroke="url(#windowBorder)" stroke-width="2" />
    
    <!-- Window Top Header Bar -->
    <path d="M 76 116 L 436 116" stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1" />
    
    <!-- Window Status Dots -->
    <circle cx="104" cy="98" r="4.5" fill="#EF4444" fill-opacity="0.8" />
    <circle cx="120" cy="98" r="4.5" fill="#F59E0B" fill-opacity="0.8" />
    <circle cx="136" cy="98" r="4.5" fill="#10B981" fill-opacity="0.8" />

    <!-- Terminal Prompt / Shizuku Active Indicator in Header -->
    <rect x="156" y="93" width="70" height="10" rx="5" fill="#38BDF8" fill-opacity="0.15" />
    <circle cx="408" cy="98" r="3.5" fill="#38BDF8" fill-opacity="0.7" />
    <circle cx="394" cy="98" r="3.5" fill="#818CF8" fill-opacity="0.5" />

    <!-- OpenCV Vision Template Matching Focus Brackets (ROI Reticles) -->
    <!-- Top-Left -->
    <path d="M 104 146 L 104 134 Q 104 130 108 130 L 120 130" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />
    <!-- Top-Right -->
    <path d="M 392 130 L 404 130 Q 408 130 408 134 L 408 146" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />
    <!-- Bottom-Left -->
    <path d="M 104 386 L 104 398 Q 104 402 108 402 L 120 402" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />
    <!-- Bottom-Right -->
    <path d="M 392 402 L 404 402 Q 408 402 408 398 L 408 386" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" />
  </g>

  <!-- Remote Transmission Waves (Top-Right of Central Emblem) -->
  <g stroke="url(#signalGrad)" fill="none" stroke-linecap="round">
    <path d="M 370 148 A 45 45 0 0 1 405 183" stroke-width="2.5" stroke-opacity="0.85" />
    <path d="M 382 136 A 62 62 0 0 1 424 178" stroke-width="2" stroke-opacity="0.5" />
    <path d="M 394 124 A 79 79 0 0 1 443 173" stroke-width="1.5" stroke-opacity="0.25" />
  </g>

  <!-- Vision Coordinate Grid Lines / Crosshairs -->
  <g stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="3 4">
    <line x1="240" y1="130" x2="240" y2="402" />
    <line x1="104" y1="272" x2="408" y2="272" />
  </g>

  <!-- Orbit Ring Behind Main Planet -->
  <g transform="rotate(-28 240 272)">
    <!-- Back Half of Ellipse (Drawn with depth) -->
    <path d="M 100 272 A 140 68 0 0 1 380 272" fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 6" stroke-opacity="0.4" />
  </g>

  <!-- Central Core: Lua Primary Planet (Moon) -->
  <g filter="url(#shadowFilter)">
    <!-- Outer Glow Aura -->
    <circle cx="236" cy="272" r="74" fill="#2563EB" fill-opacity="0.2" filter="url(#glowFilter)" />

    <!-- Main Body Sphere -->
    <circle cx="236" cy="272" r="70" fill="url(#luaMoonGrad)" />

    <!-- Lua Crescent Light Highlight -->
    <path d="M 236 204 A 68 68 0 0 1 304 272 A 68 68 0 0 1 270 330 Q 236 295 236 240 Q 236 215 236 204 Z" fill="url(#crescentGrad)" />

    <!-- Inner Core Tech Node -->
    <circle cx="218" cy="254" r="24" fill="#0B1329" fill-opacity="0.85" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" />
    
    <!-- Code / Automation Glyph inside Lua Core: `>` Prompt -->
    <path d="M 213 246 L 223 254 L 213 262" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="228" cy="262" r="1.5" fill="#38BDF8" />
  </g>

  <!-- Orbit Ring Front Segment (Over the planet) -->
  <g transform="rotate(-28 240 272)">
    <!-- Front Half of Ellipse -->
    <path d="M 380 272 A 140 68 0 0 1 100 272" fill="none" stroke="url(#orbitGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glowFilter)" />
  </g>

  <!-- Orbiting Satellite Node (Lua Satellite with Glowing Aura) -->
  <!-- Position: ~ (352, 196) -->
  <g filter="url(#intenseGlow)">
    <!-- Outer Pulse Ring -->
    <circle cx="352" cy="196" r="28" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3 3" />
    
    <!-- Satellite Body -->
    <circle cx="352" cy="196" r="20" fill="url(#satelliteGrad)" stroke="#FFFFFF" stroke-width="2.5" />
    
    <!-- Specular Highlight -->
    <circle cx="346" cy="190" r="5" fill="#FFFFFF" fill-opacity="0.9" />
  </g>

  <!-- Touch Injection / Target Point Indicator (Bottom Left) -->
  <g transform="translate(142, 344)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="8" fill="#38BDF8" fill-opacity="0.25" />
    <circle cx="0" cy="0" r="3" fill="#38BDF8" />
    <!-- Touch Ring Pulse -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 3" />
  </g>

  <!-- Stylized ReLC Brand Tag at Bottom -->
  <g transform="translate(256, 460)">
    <rect x="-56" y="-14" width="112" height="22" rx="11" fill="#1E293B" fill-opacity="0.8" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4" />
    <text x="0" y="2" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2.5" text-anchor="middle">ReLC</text>
  </g>
</svg>
